<!DOCTYPE html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- POC: every page served under a deeper path by a _redirects 200 rule needs its relative
       asset URLs (../chunk-*.js) resolved from the site root, not from the address shown. -->
  <base href="/" />
  <script data-theme-boot>
    try {
      const theme = localStorage.getItem("cc:theme");
      if (theme === "light" || theme === "dark")
        document.documentElement.setAttribute("data-theme", theme);
    } catch {
      // Storage blocked: leave the theme to the device, as getTheme() does.
    }
    try {
      // The build's tint before first paint; chrome.ts stamps the build's own value after.
      const host = location.hostname;
      document.documentElement.setAttribute(
        "data-env",
        host === "localhost" || host === "127.0.0.1"
          ? "local"
          : /^pr-\d+-.*workers\.dev$/.test(host)
            ? "preview"
            : "production",
      );
    } catch {
      // No location: chrome.ts sets the tint once the bundle runs.
    }
  </script>
  <title>POC other — cc-tracking</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />

  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-5TMJN4ZX');</script>
  <!-- End Google Tag Manager -->
  <script type="module" src="./other.ts"></script>
</head>
